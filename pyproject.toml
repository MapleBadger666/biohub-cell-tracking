[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "biohub-cell-tracking"
version = "0.1.0"
description = "Research pipeline for the Biohub Cell Tracking During Development Kaggle competition."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.9.1",
    "numpy",
    "scipy",
    "pandas",
    "polars",
    "zarr>=3.0.10",
    "tqdm",
    "scikit-learn",
    "scikit-image",
    "matplotlib",
    "networkx",
    "tracksdata @ git+https://github.com/royerlab/tracksdata@main",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff",
    "ipykernel",
    "jupyter",
    "kaggle",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biohub_cell_tracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF"]
